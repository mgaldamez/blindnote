# BlindNote — ejecución desde la imagen publicada.
#
#   docker compose up -d              # usa ghcr.io/mgaldamez/blindnote:latest
#   docker compose pull && docker compose up -d   # trae la última publicada
#   BLINDNOTE_TAG=sha-abc1234 docker compose up -d # fija una versión
#
# Para construir desde el código fuente (desarrollo y CI) usa el override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# El esquema se inicializa solo: MySQL ejecuta database/schema.sql la primera
# vez que se crea el volumen db_data.

services:
  web:
    image: ghcr.io/mgaldamez/blindnote:${BLINDNOTE_TAG:-latest}
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NOMBRE: seguridad_web
      DB_USUARIO: blindnote
      DB_CLAVE: blindnote
      COOKIE_SOLO_HTTPS: "false"
      MODO_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seguridad_web
      MYSQL_USER: blindnote
      MYSQL_PASSWORD: blindnote
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
