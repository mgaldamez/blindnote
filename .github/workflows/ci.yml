# Integración continua de BlindNote.
#
# 1) checks  — construye la imagen con docker compose, valida la sintaxis de
#    todos los PHP y corre la regresión del control de fuerza bruta contra una
#    base MySQL real. Se ejecuta en cada push y en cada pull request.
# 2) publish — sólo en push a main o en tags vX.Y.Z: publica la imagen en
#    GitHub Container Registry (ghcr.io/<usuario>/blindnote).
#
# La imagen de GHCR nace privada; para hacerla pública: Packages -> blindnote
# -> Package settings -> Change visibility.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io exige un nombre en minúsculas; el repositorio ya lo está.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Construir y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Construir y levantar el stack
        run: docker compose up --detach --build --wait

      # `web` no declara healthcheck, así que `--wait` no prueba que Apache sirva
      # la aplicación: este smoke comprueba la respuesta HTTP real.
      - name: Smoke HTTP del formulario de login
        run: |
          set -euo pipefail
          for intento in $(seq 1 15); do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/login.php || true)
            if [ "$codigo" = "200" ]; then
              echo "GET /login.php -> 200 (intento $intento)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::GET /login.php no respondió 200 (último código: ${codigo:-sin respuesta})"
          exit 1

      - name: Lint de todos los archivos PHP
        run: >-
          docker compose exec --no-TTY web
          sh -lc 'find . -name "*.php" -not -path "./vendor/*" -print0 | sort -z | xargs -0 -n1 php -l'

      - name: Regresión del control de fuerza bruta
        run: docker compose exec --no-TTY web php tests/fuerza-bruta-test.php

      - name: Volcar logs si algo falló
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Bajar el stack
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publicar imagen en GHCR
    needs: checks
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticarse en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags y labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
